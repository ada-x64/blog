<script>
(() => {
  try {
    const stored = window.localStorage.getItem("theme");
    const isDark = stored
      ? stored === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (isDark) document.documentElement.classList.add("dark");
  } catch {}
})();
</script>

<link rel="stylesheet" href="/static/styles/fonts.css" />
